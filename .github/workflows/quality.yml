name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Start the local Pages server
        run: |
          npm run dev > /tmp/profile-site-wrangler.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8788/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/profile-site-wrangler.log
          exit 1
      - run: npm run test:lighthouse
